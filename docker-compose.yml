# =====================================================================
# DOCKER COMPOSE - PROYECTO 1: ENTERPRISE OPERATIONS AI AGENT
# =====================================================================
# Levanta toda la infraestructura del Proyecto 1 con un solo comando:
#   docker compose up -d --build
# Incluye:
#   1. Base de datos relacional PostgreSQL 16 (`postgres_ops` en puerto 5435)
#   2. API REST modular en FastAPI (`ops_api` en http://localhost:8011)
#   3. Dashboard de Telemetría en Streamlit (`ops_dashboard` en http://localhost:8521)

name: enterprise-operations-agent

services:
  postgres_ops:
    image: postgres:16-alpine
    container_name: enterprise_ops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_ops_db
    ports:
      - "5435:5432"
    volumes:
      - pgdata_ops:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ops_api:
    build: .
    container_name: enterprise_ops_api
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8011:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres_ops:5432/enterprise_ops_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      postgres_ops:
        condition: service_healthy

  ops_dashboard:
    build: .
    container_name: enterprise_ops_dashboard
    restart: unless-stopped
    command: streamlit run src/monitoring/dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8521:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres_ops:5432/enterprise_ops_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      postgres_ops:
        condition: service_healthy

volumes:
  pgdata_ops:
